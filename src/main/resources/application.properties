spring.application.name=monitoring-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/monitoring_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# API Configuration
monitoring.api-key-header=X-API-Key

# Front end Configuration
monitoring.frontend-url=http://localhost:5173
